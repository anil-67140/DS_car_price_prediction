name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install ruff
      - run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Unit + API + app tests (synthetic data, no network)
        run: python -m pytest tests -q -m "not needs_bundle"

  pipeline-smoke:
    # Integration test: real download -> clean -> ... -> package in --quick mode, then the
    # real-model regression tests and a monitoring run against the bundle that was just built.
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Run pipeline (quick configuration)
        run: python scripts/run_pipeline.py --quick --no-mlflow
      - name: Resume test - second run must be fully cached
        run: |
          python scripts/run_pipeline.py --quick --no-mlflow | tee second_run.txt
          ! grep -E "^[a-z]+ +ran" second_run.txt
      - name: Real-model regression tests
        run: python -m pytest tests/test_real_model_regression.py -q
      - name: Monitoring against the new bundle
        run: |
          python - <<'PY'
          import pandas as pd
          pd.read_csv("data/processed/test.csv")[["name","company","year","kms_driven","fuel_type"]].to_csv("traffic.csv", index=False)
          PY
          python scripts/monitor.py --new-data traffic.csv --out reports/monitoring
      - uses: actions/upload-artifact@v4
        with:
          name: model-bundle
          path: artifacts/models
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: pipeline-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: model-bundle, path: artifacts/models}
      - name: Build image
        run: docker build -t carprice:ci .
      - name: Run container and smoke-test the API
        run: |
          docker run -d --name api -p 8000:8000 -e CARPRICE_API_KEY=ci-key carprice:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break || sleep 3; done
          curl -fsS localhost:8000/version
          curl -fsS -X POST localhost:8000/v1/predict -H 'X-API-Key: ci-key' -H 'Content-Type: application/json' \
            -d '{"brand":"Maruti","model":"Swift","year":2015,"kms_driven":45000,"fuel_type":"Petrol"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/predict -d '{}')" = "401"
      - name: Container health status
        run: docker inspect --format '{{.State.Health.Status}}' api || true
      - if: failure()
        run: docker logs api
