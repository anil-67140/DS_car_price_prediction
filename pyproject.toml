[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carprice"
version = "1.0.0"
description = "Used-car price prediction and valuation system (regression, uncertainty, explainability, MLOps)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.6", "pyyaml>=6", "joblib>=1.4",
  "matplotlib>=3.8", "pandera>=0.20", "pydantic>=2.6",
]

[project.optional-dependencies]
ml = ["xgboost>=2.1", "lightgbm>=4.5", "catboost>=1.2", "interpret>=0.6", "shap>=0.46", "optuna>=4.0", "mlflow>=2.16"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "gradio>=5.0", "httpx>=0.27"]
monitor = ["evidently>=0.7"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
colab = ["kaggle>=1.6", "dvc>=3.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"
markers = ["slow: trains models (needs the ML extras)", "needs_bundle: needs a trained model bundle in artifacts/models"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "app", "api", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "B008", "SIM108", "E741", "B905", "C408"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402", "B011"]
"api/main.py" = ["E402"]
"app/app.py" = ["E402"]
